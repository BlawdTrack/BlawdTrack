name: Backend CI

on:
  push:
    paths:
      - 'blawdtrack/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'blawdtrack/backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blawdtrack/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas (H2 en memoria)
        run: bash mvnw -B verify
