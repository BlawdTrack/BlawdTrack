name: Frontend CI

on:
  push:
    paths:
      - 'blawdtrack/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'blawdtrack/frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blawdtrack/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blawdtrack/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run cpd
      - run: npm test
      - run: npm run build
