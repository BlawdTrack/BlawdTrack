# EJEMPLO de configuración: todos los valores son de relleno. No es un perfil de Spring que se cargue solo.
# El backend lee estas claves de variables de entorno (ver application.properties, application-brevo.properties
# y application-prod.properties). Define las variables en tu sistema o en tu servidor; no guardes valores reales
# en el código fuente.

# --- Base de datos MySQL (la base "blawdtrack" debe existir; Flyway crea las tablas) ---
DB_URL=jdbc:mysql://localhost:3306/blawdtrack?useSSL=false&connectionTimeZone=LOCAL
DB_USERNAME=usuario_mysql
DB_PASSWORD=<clave-de-mysql>

# --- Seguridad JWT (OBLIGATORIA: sin JWT_SECRET el backend no arranca) ---
# Clave aleatoria y privada de al menos 32 caracteres.
JWT_SECRET=<clave-aleatoria-de-32-o-mas-caracteres>
JWT_EXPIRATION_MS=3600000
JWT_ISSUER=blawdtrack-api

# --- Correo (por defecto: SMTP local de captura en localhost:1025) ---
MAIL_HOST=smtp.ejemplo.com
MAIL_PORT=587
MAIL_USERNAME=usuario-smtp
MAIL_PASSWORD=<clave-smtp>
# Remitente de los correos: correo y nombre visible por separado. El correo debe estar verificado en el proveedor
# (Brevo > Senders); usa la cuenta de la empresa para que Gmail no lo marque como sospechoso. MAIL_FROM (un solo
# valor con el correo) sigue funcionando como respaldo de MAIL_FROM_EMAIL.
MAIL_FROM_EMAIL=correo-de-la-empresa@tu-dominio.com
MAIL_FROM_NAME=Blawd Gourmet
MAIL_LINK_URL=http://localhost:5173/recovery
MAIL_SMTP_AUTH=true
MAIL_STARTTLS_ENABLED=true
MAIL_STARTTLS_REQUIRED=true

# --- Swagger (documentación interactiva de la API) ---
# Oculto por defecto (404). Solo para desarrollo: SWAGGER_ENABLED=true lo activa en /swagger-ui.html y /v3/api-docs.
SWAGGER_ENABLED=false

# --- Perfil de producción (SPRING_PROFILES_ACTIVE=prod,brevo) ---
# Orígenes del frontend autorizados, separados por comas.
CORS_ALLOWED_ORIGINS=https://tu-frontend.ejemplo.com
# Puerto que asigna el servidor (por defecto 8080).
PORT=8080
# Contraseña inicial del Súper Usuario (opcional; si se omite se usa la de desarrollo del DataSeeder).
SUPER_USER_INITIAL_PASSWORD=
# En desarrollo cada arranque restaura la contraseña del Súper Usuario; ponlo en false en cualquier despliegue real.
SEED_RESET_SUPER_USER_PASSWORD=false
