<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#FAF8F5;font-family:Arial,Helvetica,sans-serif;color:#1F2421;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#FAF8F5;">{{preheader}}</div>

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#FAF8F5;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
               style="width:100%;max-width:600px;border-collapse:separate;border-spacing:0;background-color:#FFFFFF;border:1px solid #E4DED7;border-radius:12px;">
          <tr>
            <td style="padding:26px 32px;background-color:#1A3C34;border-bottom:4px solid #FF6C0E;border-radius:12px 12px 0 0;">
              <div style="font-size:26px;line-height:32px;font-weight:700;color:#FFFFFF;">Blawd Gourmet</div>
              <div style="margin-top:4px;font-size:12px;line-height:18px;letter-spacing:2px;text-transform:uppercase;color:#E4DED7;">{{subtitle}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 30px;background-color:#FFFFFF;">
{{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px;background-color:#F1ECE7;border-top:1px solid #E4DED7;border-radius:0 0 12px 12px;">
              <div style="font-size:12px;line-height:18px;color:#6B6560;">
                Mensaje automático de BlawdTrack, el sistema de seguimiento de paquetes de Blawd Gourmet.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
