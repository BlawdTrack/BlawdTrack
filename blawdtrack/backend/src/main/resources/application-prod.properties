# Perfil de producción (SPRING_PROFILES_ACTIVE=prod,brevo). Todo lo sensible llega por variables de entorno del
# servidor y no tiene valor por defecto: si falta una, la aplicación no arranca en vez de usar un valor de desarrollo.

# Base de datos (por ejemplo TiDB Cloud, que exige TLS en la URL).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El Super Usuario nace con una contraseña privada y nunca se restaura la de desarrollo.
app.seed.super-user.reset-password=false
app.seed.super-user.initial-password=${SUPER_USER_INITIAL_PASSWORD}

# Solo el frontend publicado puede llamar a la API desde el navegador (varios orígenes, separados por comas).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Render y similares asignan el puerto por la variable PORT y terminan el TLS delante de la aplicación.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
