# Entorno de pruebas de extremo a extremo (Katalon). Se levanta aparte del de desarrollo: usa otros puertos, otra
# base de datos y un buzón de correo de pruebas, así que puede convivir con tu backend (8080), tu frontend (5173)
# y tu MySQL (3306).
#
#   Frontend  http://localhost:5174
#   Backend   http://localhost:8081
#   Correos   http://localhost:8025   (Mailpit: aquí llegan el enlace de recuperación y las contraseñas temporales)
#   MySQL     localhost:3307          (usuario root, contraseña e2e-root; solo escucha en 127.0.0.1)
#
# No lo ejecutes a mano: usa scripts/up.ps1, que genera el JWT_SECRET, espera a que el backend responda y deja
# listas las cuentas y los datos de prueba.
name: blawdtrack-e2e

services:
  mysql:
    image: mysql:8.4
    container_name: blawdtrack-e2e-mysql
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root
      MYSQL_DATABASE: blawdtrack
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pe2e-root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: blawdtrack-e2e-mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  backend:
    build:
      context: ../../backend
      dockerfile: ../katalon/environment/backend.Dockerfile
    container_name: blawdtrack-e2e-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blawdtrack?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: e2e-root
      # Lo genera scripts/up.ps1 en cada arranque; no se guarda en el repositorio.
      JWT_SECRET: ${JWT_SECRET:?Usa scripts/up.ps1, que genera el JWT_SECRET}
      SEED_RESET_SUPER_USER_PASSWORD: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_LINK_URL: http://localhost:5174/recovery
      JAVA_TOOL_OPTIONS: -Xmx512m
    ports:
      - "127.0.0.1:8081:8080"

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../katalon/environment/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8081/api
    container_name: blawdtrack-e2e-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:5174:80"
