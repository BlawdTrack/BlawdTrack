# Configuración exclusiva para pruebas.
# Sustituye MySQL por H2 en memoria (modo de compatibilidad MySQL) para no depender
# de un servidor MySQL real y para evitar tener que reconciliar la sintaxis de las
# migraciones Flyway (pensadas para MySQL) con H2.
spring.datasource.url=jdbc:h2:mem:blawdtrack-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# En tests el esquema se genera a partir de las entidades JPA, no de Flyway.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

security.jwt.secret=clave-de-pruebas-no-usar-en-produccion-min-32-caracteres
security.jwt.expiration-ms=3600000
