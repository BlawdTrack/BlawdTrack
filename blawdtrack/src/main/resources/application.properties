spring.application.name=blawdtrack

 spring.docker.compose.enabled=false

# Local/dev database. Por defecto usa MySQL (estándar del proyecto); si preferís levantar
# sin un servidor MySQL local, podés cambiar la URL a H2 en modo compatibilidad MySQL:
# jdbc:h2:mem:blawdtrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:mysql://localhost:3306/blawdtrack?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT security (com.blawdgourmet.blawdtrack.auth.security.JwtService) - estándar P07.
# Clave aleatoria privada de al menos 32 bytes; NUNCA guardar en el repositorio,
# debe inyectarse vía variable de entorno JWT_SECRET.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.jwt.issuer=${JWT_ISSUER:blawdtrack-api}
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/blawdtrack?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Clave aleatoria privada de al menos 32 bytes; no guardar en el repositorio.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# SMTP local por defecto. En produccion configurar un proveedor y habilitar TLS/auth.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS_ENABLED:false}
spring.mail.properties[mail.smtp.starttls.required]=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
app.mail.from=${MAIL_FROM:no-reply@blawdtrack.local}
app.mail.link-url=${MAIL_LINK_URL:http://localhost:5173/recovery}
