spring.application.name=blawdtrack

# Local database for development and testing. H2 in-memory is used so the app can start
# without an external MySQL server while still keeping compatibility with the MySQL dialect
# in queries and the JPA schema.
spring.datasource.url=jdbc:h2:mem:blawdtrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Docker Compose must be disabled in local development when containers are not being used.
# If project services are needed with Docker, it can be re-enabled with a valid compose file.
spring.docker.compose.enabled=false

# JWT security (see com.blawdgourmet.blawdtrack.security.JwtService) - P07 standard.
# In a real environment this value MUST be injected through an environment variable (JWT_SECRET)
# and never committed in plain text; a default value is kept only for local development.
security.jwt.secret=${JWT_SECRET:CambieEstaClaveSecretaAntesDeDesplegarAProduccionBlawdTrack2026}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.jwt.issuer=${JWT_ISSUER:blawdtrack-api}

# Intended only for the local development environment while a migration tool (Flyway/Liquibase)
# does not exist; the final strategy is defined in Systems Engineering III.
spring.jpa.hibernate.ddl-auto=update

# Local SMTP defaults. These values create JavaMailSender without requiring
# external credentials; use the "brevo" profile for real SMTP delivery.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS_ENABLED:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.mail.from=${MAIL_FROM:no-reply@blawdtrack.local}
app.mail.link-url=${MAIL_LINK_URL:http://localhost:5173/recovery}
